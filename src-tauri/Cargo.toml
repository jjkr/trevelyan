[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
global-hotkey = "0.5.0"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
window-vibrancy = "0.5.0"
cocoa = "0.24.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel" }
# Candle ecosystem for Distil-Whisper
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = "0.9"
candle-transformers = "0.9"
hf-hub = { version = "0.3", features = ["tokio"] }
whisper-rs = "0.12"
tokenizers = "0.19"
anyhow = "1.0"
tracing = "0.1"

# Audio processing (keep existing)
cpal = "0.15"
hound = "3.5"
crossbeam-channel = "0.5"
ringbuf = "0.3"
reqwest = { version = "0.11", features = ["stream"] }

# Additional utilities
uuid = { version = "1.0", features = ["v4"] }
thiserror = "1.0"
