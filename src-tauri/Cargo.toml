[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.6.2", features = ["macos-private-api"] }
tauri-plugin-log = "2"
global-hotkey = "0.5.0"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
cocoa = "0.24.0"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel" }

# Audio processing
cpal = "0.16"
symphonia = { version = "0.5", features = ["wav", "mp3"] }

# Candle ML framework
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
hf-hub = "0.3"
tokenizers = "0.19"
byteorder = "1.5"
anyhow = "1.0"
